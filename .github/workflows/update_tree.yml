name: Update README with Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # IMPORTANT: Fetch full history to allow rebasing

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Install tree
        run: sudo apt-get install tree

      - name: Generate TREE.md and update README.md
        run: bash update-readme.sh

      - name: Pull latest changes
        run: git pull origin main --rebase

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add TREE.md README.md
          git commit -m "Auto-update directory tree in README" || echo "No changes to commit"
          git push origin main
