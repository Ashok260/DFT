name: Update README with Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tree
        run: sudo apt-get install -y tree

      - name: Generate tree
        run: bash generate_tree.sh

      - name: Update README
        run: bash update_readme.sh

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Ashok260/DFT.git
          git add README.md
          git commit -m "Auto-update directory tree in README" || echo "No changes to commit"
          git push
