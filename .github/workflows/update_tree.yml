name: Update README with Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Fetch and rebase with latest main
        run: |
          git fetch origin
          git rebase origin/main

      - name: Install tree
        run: sudo apt-get install -y tree

      - name: Generate TREE.md and update README.md
        run: bash update_readme.sh

      - name: Commit changes (only if needed)
        run: |
          git add README.md TREE.md
          git diff --cached --quiet || git commit -m "Auto-update directory tree in README"

      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main
