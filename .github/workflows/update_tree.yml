name: Update README with Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important to allow rebase

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Install tree
        run: sudo apt-get install tree

      - name: Generate TREE.md and update README.md
        run: bash update_readme.sh

      - name: Commit changes
        run: |
          git add README.md TREE.md
          git commit -m "Auto-update directory tree in README" || echo "No changes to commit"

      - name: Pull latest changes from main
        run: git pull origin main --rebase

      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin main
